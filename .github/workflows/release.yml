name: Build and Release Binaries

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: gh-organizer-linux
            asset_name: gh-organizer-linux
          - os: windows-latest
            artifact_name: gh-organizer-windows.exe
            asset_name: gh-organizer-windows.exe
          - os: macos-latest
            artifact_name: gh-organizer-macos
            asset_name: gh-organizer-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      # ---- GENERAR APPIMAGE (Solo en Linux) ----
      - name: Build AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file zsync
          uv add --dev appimage
          uv run python -m appimage.ctl init
          uv run python -m appimage.ctl lock
          uv run python -m appimage.ctl build

      # ---- GENERAR BINARIO CON PYINSTALLER ----
      - name: Build binary with PyInstaller
        shell: bash
        run: |
          uv add --dev pyinstaller
          uv run pyinstaller --onefile \
            --name "${{ matrix.artifact_name }}" \
            --add-data "src/gh_organizer/ui/styles:gh_organizer/ui/styles" \
            --add-data "src/gh_organizer/ui/auth.tcss:gh_organizer/ui" \
            --collect-all textual \
            --collect-all pygithub \
            --collect-all keyring \
            --collect-all nerdfont \
            --collect-all tomli_w \
            src/gh_organizer/__main__.py

      - name: Prepare asset
        shell: bash
        run: |
          mkdir -p release
          if [ -f "dist/${{ matrix.artifact_name }}" ]; then
            cp "dist/${{ matrix.artifact_name }}" "release/${{ matrix.asset_name }}"
          elif [ -f "dist/${{ matrix.artifact_name }}.exe" ]; then
            cp "dist/${{ matrix.artifact_name }}.exe" "release/${{ matrix.asset_name }}"
          else
            echo "Error: No se encontró el binario en dist/"
            ls -la dist/
            exit 1
          fi

      # ---- SUBIR AL RELEASE ----
      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/${{ matrix.asset_name }}
            dist/*.AppImage
          generate_release_notes: true
