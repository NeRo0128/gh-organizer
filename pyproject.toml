[project]
name = "gh-organizer"
version = "1.1.0"
description = "Una TUI para organizar tus repositorios de GitHub en colecciones personalizadas"
readme = "README.md"
authors = [{ name = "Nero", email = "castillovegarodolfogilberto@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.14"
keywords = ["github", "tui", "textual", "cli", "organizer", "repositories", "collections"]
dependencies = [
    "keyring>=25.7.0",
    "nerdfont>=3.4.0.post1",
    "pygithub>=2.10.0",
    "requests>=2.32.0",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
gh-organizer = "gh_organizer.__main__:main"

[project.urls]
Homepage = "https://github.com/NeRo0128/gh-organizer"
Repository = "https://github.com/NeRo0128/gh-organizer"
Issues = "https://github.com/NeRo0128/gh-organizer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_organizer"]

[tool.hatch.build.targets.sdist]
include = [
    "src/gh_organizer/**/*.tcss",
    "src/gh_organizer/**/*.mo",
]

[tool.hatch.build.targets.wheel.force-include]
# Estilos (tcss)
"src/gh_organizer/ui/styles/auth.tcss" = "gh_organizer/ui/styles/auth.tcss"
"src/gh_organizer/ui/styles/base.tcss" = "gh_organizer/ui/styles/base.tcss"
"src/gh_organizer/ui/styles/main.tcss" = "gh_organizer/ui/styles/main.tcss"
"src/gh_organizer/ui/styles/modals.tcss" = "gh_organizer/ui/styles/modals.tcss"
"src/gh_organizer/ui/styles/settings.tcss" = "gh_organizer/ui/styles/settings.tcss"

# Traducciones compiladas (mo)
"src/gh_organizer/locales/es/LC_MESSAGES/gh_organizer.mo" = "gh_organizer/locales/es/LC_MESSAGES/gh_organizer.mo"
"src/gh_organizer/locales/en/LC_MESSAGES/gh_organizer.mo" = "gh_organizer/locales/en/LC_MESSAGES/gh_organizer.mo"

[dependency-groups]
dev = ["appimage>=4.0.1", "pytest>=9.2.0"]

[tool.appimage]
build_pylock = "pylock.build.toml"

pylock = "pylock.toml"

app = "gh-organizer"
entry_point = "gh-organizer"
python = "3.14"
update_info = "gh-releases-zsync|NeRo0128|gh-organizer|latest|gh-organizer-x86_64.AppImage.zsync"
python_date = "20261020"
python_sha256 = "b88a4ac994ac55c35a03a3672103618d5c5d5bf342db7b2093b8d328b6516b42"
appimage_version = "4.0.1"
