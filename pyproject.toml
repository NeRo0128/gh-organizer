[project]
name = "gh-organizer"
version = "1.0.0"
description = "Una TUI para organizar tus repositorios de GitHub en colecciones personalizadas"
readme = "README.md"
authors = [{ name = "Nero", email = "castillovegarodolfogilberto@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "keyring>=25.7.0",
    "nerdfont>=3.4.0.post1",
    "pygithub>=2.10.0",
    "requests>=2.32.0",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]

[project.scripts]
gh-organizer = "gh_organizer.__main__:main"

[project.urls]
Homepage = "https://github.com/NeRo0128/gh-organizer"
Repository = "https://github.com/NeRo0128/gh-organizer"
Issues = "https://github.com/NeRo0128/gh-organizer/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
