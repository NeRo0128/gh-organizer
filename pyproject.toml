[project]
name = "github-organizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nero", email = "castillovegarodolfogilberto@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "keyring>=25.7.0",
    "nerdfont>=3.4.0.post1",
    "pygithub>=2.10.0",
    "textual>=8.2.8",
]

[project.scripts]
github-organizer = "github_organizer.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pygithub.*",
]

[tool.coverage.run]
source = ["src/github_organizer"]
omit = [
    "*/ui/*",
    "*/__main__.py",
    "*/app.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
